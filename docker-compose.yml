# ================================================
# Laras Banyuwangi — Docker Compose (Production)
# ================================================
# Usage:
#   docker compose up -d                     # start all services
#   docker compose exec app php artisan migrate  # run migrations
# ================================================

services:
  # ---- PHP-FPM + Laravel App ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laras-banyuwangi/app:latest
    container_name: laras-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-https://laras-banyuwangi.example.com}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-laras_banyuwangi}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: "6379"

      SESSION_DRIVER: redis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: "${MAIL_PORT:-1025}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"
    volumes:
      - laras-storage:/app/storage
    networks:
      - laras-network
    healthcheck:
      test: ["CMD", "php", "-r", "echo 'ok';"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---- Nginx ----
  nginx:
    image: nginx:1.27-alpine
    container_name: laras-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/app/public:ro
      - laras-storage:/app/storage:ro
    networks:
      - laras-network

  # ---- PostgreSQL ----
  postgres:
    image: postgres:17-alpine
    container_name: laras-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laras_banyuwangi}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_EXPOSE_PORT:-127.0.0.1:5432}:5432"
    networks:
      - laras-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-laras_banyuwangi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: laras-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - laras-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---- Mailpit (dev mail catcher) ----
  mailpit:
    image: axllent/mailpit:latest
    container_name: laras-mailpit
    restart: unless-stopped
    profiles:
      - dev
    ports:
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    networks:
      - laras-network

networks:
  laras-network:
    driver: bridge

volumes:
  laras-storage:
  postgres-data:
  redis-data:
