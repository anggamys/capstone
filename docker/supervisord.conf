# Laras Banyuwangi — Supervisor config
[supervisord]
nodaemon = true
logfile = /var/log/supervisord/supervisord.log
pidfile = /var/run/supervisord.pid
user = root

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = true
startretries = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:php-fpm]
command = php-fpm -F
autostart = true
autorestart = true
startretries = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:queue-worker]
command = php /app/artisan queue:work --tries=3 --delay=10 --timeout=180
process_name = %(program_name)s_%(process_num)02d
numprocs = 1
autostart = true
autorestart = true
startretries = 3
user = www-data
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
